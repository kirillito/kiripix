[project]
name = "kiripix"
version = "0.0.1"
description = "A local pixel asset studio for Godot games"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "pillow>=11",
    "psutil>=6",
    "pydantic>=2.9",
    "tomli-w>=1.1",
    "typer>=0.15",
]

[project.scripts]
kiripix = "kiripix.cli:main"
kpx = "kiripix.cli:main"

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "jsonschema>=4.23",
    "mypy>=1.13",
    "pytest>=8.3",
    "types-psutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kiripix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
packages = ["kiripix"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

# The import rule (spec §13). Layers: a module may import the layers below it, never above.
[tool.importlinter]
root_package = "kiripix"

[[tool.importlinter.contracts]]
name = "Layers: adapters, commands, core, recipes, runners and providers, checks, ops"
type = "layers"
layers = [
    "kiripix.cli | kiripix.server",
    "kiripix.commands",
    "kiripix.core | kiripix.export",
    "kiripix.recipes",
    "kiripix.runners | kiripix.providers",
    "kiripix.checks",
    "kiripix.ops",
]

[[tool.importlinter.contracts]]
name = "Adapters use only commands"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["kiripix.cli", "kiripix.server"]
forbidden_modules = [
    "kiripix.core",
    "kiripix.export",
    "kiripix.recipes",
    "kiripix.runners",
    "kiripix.providers",
    "kiripix.checks",
    "kiripix.ops",
]
