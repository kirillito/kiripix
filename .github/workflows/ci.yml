name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v10.3.3  # no major tags since v8: pinned to an exact release
      - name: Install the locked environment
        run: uv sync --locked
      - name: Import rule
        run: uv run lint-imports
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest
